[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinela-brasil"
version = "0.1.0"
description = "Plataforma demonstrativa de soberania de dados, governança de acesso e IA confiável"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Impulso Digital Soluções em I.A." }]
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "cryptography>=50.0.2,<51"]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10", "httpx2>=2.13,<3"]
dev = ["ruff>=0.6,<1", "pip-audit>=2.10,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinela = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
